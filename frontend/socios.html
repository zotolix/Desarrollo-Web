<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socios - Biblioteca Web</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="index.html">Biblioteca Web</a>
    <nav aria-label="Secciones">
      <a href="index.html">Inicio</a>
      <a href="libros.html">Libros</a>
      <a href="categorias.html">Categorías</a>
      <a href="socios.html" aria-current="page">Socios</a>
      <a href="prestamos.html">Préstamos</a>
    </nav>
  </header>
  <main>
    <h1>Socios</h1>
    <p class="intro">Todo socio nuevo queda activo. Para suspender a un socio, edítalo y cambia su estado. Un socio suspendido no puede recibir préstamos.</p>
    <div id="mensaje" class="mensaje" role="status"></div>
    <div class="columnas">
      <section class="panel">
        <h2 id="titulo-form">Nuevo socio</h2>
        <form id="form-socio">
          <input type="hidden" id="socio-id">
          <label for="socio-nombre">Nombre</label>
          <input id="socio-nombre" required maxlength="120">
          <label for="socio-correo">Correo</label>
          <input id="socio-correo" type="email" required maxlength="120">
          <label for="socio-telefono">Teléfono</label>
          <input id="socio-telefono" maxlength="20">
          <div id="campo-estado" hidden>
            <label for="socio-estado">Estado</label>
            <select id="socio-estado">
              <option value="ACTIVO">Activo</option>
              <option value="SUSPENDIDO">Suspendido</option>
            </select>
          </div>
          <div class="acciones-form">
            <button type="submit" id="btn-guardar">Registrar socio</button>
            <button type="button" class="secundario" id="btn-cancelar" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>
      <section class="panel">
        <h2>Lista de socios</h2>
        <form id="form-filtros" class="filtros">
          <div><label for="f-nombre">Nombre</label><input id="f-nombre"></div>
          <div><label for="f-estado">Estado</label>
            <select id="f-estado">
              <option value="">Todos</option>
              <option value="ACTIVO">Activos</option>
              <option value="SUSPENDIDO">Suspendidos</option>
            </select>
          </div>
          <div><button type="submit" class="secundario">Buscar</button></div>
        </form>
        <div class="tabla-contenedor">
          <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Estado</th><th>Registro</th><th></th></tr></thead>
            <tbody id="tabla-socios"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/socios.js"></script>
</body>
</html>
