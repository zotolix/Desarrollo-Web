<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Préstamos - Biblioteca Web</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="index.html">Biblioteca Web</a>
    <nav aria-label="Secciones">
      <a href="index.html">Inicio</a>
      <a href="libros.html">Libros</a>
      <a href="categorias.html">Categorías</a>
      <a href="socios.html">Socios</a>
      <a href="prestamos.html" aria-current="page">Préstamos</a>
    </nav>
  </header>
  <main>
    <h1>Préstamos</h1>
    <p class="intro">Cada préstamo dura 7 días. Un socio puede tener hasta 3 préstamos sin devolver, y solo se presta un libro con ejemplares disponibles.</p>
    <div id="mensaje" class="mensaje" role="status"></div>
    <div class="columnas">
      <section class="panel">
        <h2>Prestar un libro</h2>
        <form id="form-prestamo">
          <label for="p-libro">Libro</label>
          <select id="p-libro" required></select>
          <label for="p-socio">Socio</label>
          <select id="p-socio" required></select>
          <div class="acciones-form">
            <button type="submit">Registrar préstamo</button>
          </div>
        </form>
      </section>
      <section class="panel">
        <h2>Historial de préstamos</h2>
        <form id="form-filtros" class="filtros">
          <div><label for="f-socio">Socio</label><select id="f-socio"></select></div>
          <div><label for="f-estado">Estado</label>
            <select id="f-estado">
              <option value="">Todos</option>
              <option value="ACTIVO">Activos</option>
              <option value="DEVUELTO">Devueltos</option>
              <option value="VENCIDO">Vencidos</option>
            </select>
          </div>
          <div><button type="submit" class="secundario">Buscar</button></div>
        </form>
        <div class="tabla-contenedor">
          <table>
            <thead><tr><th>Libro</th><th>Socio</th><th>Prestado</th><th>Devolver antes de</th><th>Estado</th><th></th></tr></thead>
            <tbody id="tabla-prestamos"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/prestamos.js"></script>
</body>
</html>
