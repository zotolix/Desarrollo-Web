spring.application.name=biblioteca
server.port=8080

# Conexion a MySQL. Usuario y clave se pueden pasar con las variables de entorno
# DB_USER y DB_PASSWORD para no subir contrasenas reales al repositorio.
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:biblio}
spring.datasource.password=${DB_PASSWORD:cambiar_clave}

# El esquema se crea con database/esquema.sql; Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
